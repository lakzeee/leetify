networks:
  custom:
    ipam:
      config:
        - subnet: 10.5.0.0/16

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: 
      custom:
  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - 27017:27017
    volumes:
      - mgdata:/var/lib/mongodb/data
    networks: 
      custom:
  gateway-svc:
    image: lak919/leetify-gateway-svc:latest
    build:
      context: .
      dockerfile: src/GatewayService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - Jwt__Issuer=http://localhost:3000
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - VIRTUAL_HOST=api.leetify.com
    networks:
      custom:
  question-svc:
    image: lak919/leetify-question-svc:latest
    build:
      context: .
      dockerfile: src/QuestionService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_URLS=http://+:5555
      - ConnectionStrings__QuestionDbConnection=Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=questions
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5555
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
    ports:
      - 5005:80
      - 5555:5555
    networks:
      custom:
    depends_on:
      - postgres
  progress-svc:
    image: lak919/leetify-progress-svc:latest
    build:
      context: .
      dockerfile: src/ProgressService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__ProgressDbConnection=Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=progress
      - Jwt__Issuer=http://localhost:3000
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - GrpcQuestion=http://question-svc:5555
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5557
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
    ports:
      - 5004:80
      - 5557:5557
    networks:
      custom:
    depends_on:
      - postgres
  user-svc:
    image: lak919/leetify-user-svc:latest
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
      - Jwt__Issuer=http://localhost:3000
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5556
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
    ports:
      - 5556:5556
      - 5003:80
    networks:
      custom:
    depends_on:
      - mongodb
  plan-svc:
    image: lak919/leetify-plan-svc:latest
    build:
      context: .
      dockerfile: src/PlanService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
      - Jwt__Issuer=http://localhost:3000
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - GrpcUser=http://user-svc:5556
      - GrpcProgress=http://progress-svc:5557
    ports:
      - 5002:80
    networks:
      custom:
    depends_on:
      - mongodb
  search-svc:
    image: lak919/leetify-search-svc:latest
    build:
      context: .
      dockerfile: src/SearchService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
    ports:
      - 5006:80
    networks:
      custom:
    depends_on:
      - mongodb
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - 80:80
      - 443:443
    networks:
      custom:
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./devcerts:/etc/nginx/certs
volumes:
  pgdata:
  mgdata: