version: '2'

services:
  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=postgrespw
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql/data

  mongodb:
    image: mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=root
      - MONGO_INITDB_ROOT_PASSWORD=mongopw
    ports:
      - 27017:27017
    volumes:
      - mgdata:/var/lib/mongodb/data

  webapp:
    image: zhc01.azurecr.io/leetify-webapp:latest
    build:
      context: .
      dockerfile: webapp/Dockerfile
    volumes:
      - /var/lib/web/data
    environment:
      - NEXTAUTH_SECRET=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - NEXTAUTH_URL=http://leetify.live
      - API_URL=http://gateway-svc
      - GOOGLE_ID=3290488604-5nq1hdk948aj31jqfaqe4ro7l5fi0io9.apps.googleusercontent.com
      - GOOGLE_SECRET=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
      - GITHUB_ID=d2113a84e9cddfef5140
      - GITHUB_SECRET=0d30ec94348b7b812a858b8c728292db0b9efa1c
      - VIRTUAL_HOST=leetify.live
      - LETSENCRYPT_HOST=leetify.live
      - VIRTUAL_PORT=3000

  gateway-svc:
    image: zhc01.azurecr.io/leetify-gateway-svc:latest
    build:
      context: .
      dockerfile: src/GatewayService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:80
      - VIRTUAL_HOST=api.leetify.live
      - LETSENCRYPT_HOST=api.leetify.live
      - Jwt__Issuer=https://leetify.live
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
  question-svc:
    image: zhc01.azurecr.io/leetify-question-svc:latest
    build:
      context: .
      dockerfile: src/QuestionService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ASPNETCORE_URLS=http://+:5555
      - ConnectionStrings__QuestionDbConnection=Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=questions
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Kestrel__Endpoints__Grpc__Url=http://+:5555
      - Kestrel__Endpoints__WebApi__Protocols=Http1
      - Kestrel__Endpoints__WebApi__Url=http://+:80
    ports:
      - 5005:80
      - 5555:5555
    depends_on:
      - postgres
  progress-svc:
    image: zhc01.azurecr.io/leetify-progress-svc:latest
    build:
      context: .
      dockerfile: src/ProgressService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__ProgressDbConnection=Server=postgres:5432;User Id=postgres;Password=postgrespw;Database=progress
      - Jwt__Issuer=https://leetify.live
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
      - GrpcQuestion=http://question-svc:5555
    ports:
      - 5004:80
    depends_on:
      - postgres
  user-svc:
    image: zhc01.azurecr.io/leetify-user-svc:latest
    build:
      context: .
      dockerfile: src/UserService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
      - Jwt__Issuer=https://leetify.live
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
    ports:
      - 5003:80
    depends_on:
      - mongodb
  plan-svc:
    image: zhc01.azurecr.io/leetify-plan-svc:latest
    build:
      context: .
      dockerfile: src/PlanService/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80
      - ConnectionStrings__MongoDbConnection=mongodb://root:mongopw@mongodb
      - Jwt__Issuer=https://leetify.live
      - Jwt__Key=V7iy5gPZcCWcaSnnHhRJrXSFqsSxOtLSCjrBFwgpE
    ports:
      - 5002:80
    depends_on:
      - mongodb
  nginx-proxy:
    image: nginxproxy/nginx-proxy
    ports:
      - 80:80
      - 443:443
    volumes:
      - conf:/etc/nginx/conf.d
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - certs:/etc/nginx/certs:ro
      - /var/run/docker.sock:/tmp/docker.sock:ro
  acme-companion:
    image: nginxproxy/acme-companion
    container_name: nginx-proxy-acme
    environment:
      - DEFAULT_EMAIL=caizh1997@live.com
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs:rw
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  pgdata:
  mgdata:
  conf:
  vhost:
  html:
  certs:
  acme: