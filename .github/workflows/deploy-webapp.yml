name: Deploy Webapp Server

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
    paths:
      - 'webapp/**'

env:
  REGISTRY_IMAGE: leetify-webapp
  DOCKERFILE: webapp/Dockerfile

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        
      - name: Log in to container registry
        uses: docker/login-action@v1
        with:
          registry: zhc01.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: zhc01.azurecr.io/${{ env.REGISTRY_IMAGE }}:latest
          file: ${{ env.DOCKERFILE }}
          context: ./
  deploy:
    name: deploy through ssh
    runs-on: ubuntu-latest
    steps:
    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          whoami
          sudo docker login zhc01.azurecr.io -u ${{ secrets.AZURE_REGISTRY_USERNAME }} -p ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          sudo docker pull ${{ env.REGISTRY_IMAGE }}
          cd /var/app
          docker compose up -d