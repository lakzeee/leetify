name: Deploy Gateway Server

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
    paths:
        - '**'

jobs:
  deploy:
    name: login to ssh
    runs-on: ubuntu-latest
    steps:
    - name: executing remote ssh commands using password
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USERNAME }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          whoami
          sudo docker login zhc01.azurecr.io -u ${{ secrets.AZURE_REGISTRY_USERNAME }} -p ${{ secrets.AZURE_REGISTRY_PASSWORD }}
          sudo docker pull zhc01.azurecr.io/leetify-webapp
          cd /var/app
          docker compose up -d
          
          