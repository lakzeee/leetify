name: Deploy Question Server

on:
  workflow_dispatch: 
  push:
    branches: [ "main" ]
    paths:
      - 'src/QuestionService/**'

env:
  REGISTRY_IMAGE: leetify-question-svc
  DOCKERFILE: src/QuestionService/Dockerfile
  SVC_NAME: auction-svc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v2
        
      - name: Log in to container registry
        uses: docker/login-action@v1
        with:
          registry: zhc01.azurecr.io
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@v2
        with:
          push: true
          tags: zhc01.azurecr.io/${{ env.REGISTRY_IMAGE }}:latest
          file: ${{ env.DOCKERFILE }}
          context: "{{defaultContext}}"